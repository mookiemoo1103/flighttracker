name: Generate U.S. flight tracker placefile

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flighttracker-placefile
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate placefile generator
        run: python -m py_compile flighttracker.py
      - name: Fetch full U.S. coverage grid (manual backup only)
        env:
          FLYITALYADSB_API_KEY: ${{ secrets.FLYITALYADSB_API_KEY }}
        run: python flighttracker.py
      - name: Commit refreshed placefile and rolling aircraft cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flighttracker.txt aircraft_cache.json
          if git diff --cached --quiet; then
            echo "No placefile changes"
            exit 0
          fi
          git commit -m "Refresh full U.S. aircraft coverage"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push; then
              exit 0
            fi
            echo "Push attempt $attempt rejected; retrying after remote update"
            sleep 3
          done
          echo "Could not publish refreshed placefile after three attempts"
          exit 1
