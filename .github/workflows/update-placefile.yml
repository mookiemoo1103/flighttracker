name: Generate US flight tracker placefile

on:
  workflow_dispatch:
  schedule:
    - cron: "*/1 * * * *"

permissions:
  contents: write

concurrency:
  group: flighttracker-placefile
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch ADS-B data and render placefile
        run: python flighttracker.py --once
      - name: Commit updated placefile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flighttracker.txt
          if git diff --cached --quiet; then
            echo "No placefile changes"
            exit 0
          fi
          git commit -m "Update live aircraft positions"
          git push
