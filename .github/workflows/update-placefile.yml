name: Generate US flight tracker placefile

on:
  workflow_dispatch:
  # Anonymous OpenSky access: national query costs 4 credits, 400 credits/day.
  # Every 15 minutes uses 384 credits/day, within the published free allowance.
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image dependency
        run: pip install -r requirements.txt
      - name: Generate aircraft icons
        run: python generate_assets.py
      - name: Fetch current aircraft and render valid GR placefile
        run: python flighttracker.py --once
      - name: Commit placefile and icon asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flighttracker.txt assets/aircraft.png
          if git diff --cached --quiet; then
            echo "No placefile changes"
            exit 0
          fi
          git commit -m "Update live flight positions and aircraft icons"
          git push
