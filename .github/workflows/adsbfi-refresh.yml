name: Refresh adsb.fi aircraft cache

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: adsbfi-refresh
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch all lower-48 adsb.fi regions
        run: python adsbfi_collector.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Write snapshots to Cloudflare D1
        run: npx wrangler@4 d1 execute DB --remote --file=adsbfi_refresh.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "ff9184692bc7005819c0d11e2aa7e1a3"
