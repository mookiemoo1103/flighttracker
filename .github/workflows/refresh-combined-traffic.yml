name: Refresh Separate TomTom and Louisiana 511 Traffic Feeds

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/generate-traffic.mjs"
      - "scripts/generate-traffic-events.mjs"
      - ".github/workflows/refresh-combined-traffic.yml"

permissions:
  contents: write

concurrency:
  group: separate-traffic-feeds
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate TomTom traffic speed files
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
        run: node scripts/generate-traffic.mjs
      - name: Generate separate 511LA and DOTD event files
        env:
          LOUISIANA_511_API_KEY: ${{ secrets.LOUISIANA_511_API_KEY }}
        run: node scripts/generate-traffic-events.mjs
      - name: Validate separate source files
        run: |
          set -euo pipefail
          test -s traffic.txt
          test -s traffic.geojson
          test -s traffic-events/traffic-events.txt
          test -s traffic-events/traffic-events.geojson
          test -s traffic-events/assets/road-closure.png
          test -s traffic-events/assets/road-construction.png
          test -s traffic-events/assets/road-incident.png
          grep -q 'Source: TomTom Traffic Flow Vector Tiles' traffic.txt
          ! grep -q '511LA / DOTD EVENT LAYER' traffic.txt
          grep -q 'Sources: Louisiana 511LA Events API + DOTD 511 Road Closures FeatureServer' traffic-events/traffic-events.txt
          node --input-type=module -e '
            import { readFile } from "node:fs/promises";
            const roads=JSON.parse(await readFile("traffic.geojson","utf8"));
            const events=JSON.parse(await readFile("traffic-events/traffic-events.geojson","utf8"));
            if(roads.type!=="FeatureCollection" || !Array.isArray(roads.features) || !roads.features.length) throw Error("TomTom GeoJSON is invalid or empty");
            if(events.type!=="FeatureCollection" || !Array.isArray(events.features)) throw Error("Event GeoJSON is invalid");
            if(!String(roads.metadata?.source||"").includes("TomTom")) throw Error("TomTom source metadata missing");
            if(!Array.isArray(events.metadata?.sources) || !events.metadata.sources.some(s=>String(s).includes("511LA")) || !events.metadata.sources.some(s=>String(s).includes("DOTD"))) throw Error("511LA/DOTD source metadata missing");
            if(roads.features.some(f=>f.properties?.source || f.properties?.layer==="511la-dotd-events")) throw Error("Non-TomTom event data found in TomTom GeoJSON");
            if(roads.features.some(f=>f.geometry?.type!=="LineString")) throw Error("Unexpected geometry in TomTom GeoJSON");
            if(events.features.some(f=>!["Point","MultiLineString"].includes(f.geometry?.type))) throw Error("Unexpected geometry in event GeoJSON");
            if(events.features.some(f=>f.geometry?.type==="MultiLineString" && (!Array.isArray(f.geometry.coordinates) || !f.geometry.coordinates.some(line=>Array.isArray(line) && line.length>=2)))) throw Error("Invalid roadway line geometry in event GeoJSON");
            if(events.features.some(f=>!f.properties?.source || !(f.properties?.source_event_type || f.properties?.event_subtype))) throw Error("Event source/type attribution missing");
            const eventTypes=new Set(["closure","construction","workers","incident","weather_incident","weather_closure","special","other"]);
            if(events.features.some(f=>!eventTypes.has(f.properties?.event_type))) throw Error("Unknown normalized event category");
            for(const f of events.features){if(f.geometry.type==="Point" && (!Number.isFinite(f.geometry.coordinates?.[0]) || !Number.isFinite(f.geometry.coordinates?.[1]))) throw Error("Invalid event point coordinates");if(f.geometry.type==="MultiLineString" && f.geometry.coordinates.some(line=>line.some(p=>!Number.isFinite(p[0])||!Number.isFinite(p[1])))) throw Error("Invalid event line coordinates");}
            const roadTxt=await readFile("traffic.txt","utf8");
            const eventTxt=await readFile("traffic-events/traffic-events.txt","utf8");
            const roadTxtCount=(roadTxt.match(/^Line:/gm)||[]).length;
            const eventTxtCount=(eventTxt.match(/^Object:/gm)||[]).length;
            if(roadTxtCount!==roads.features.length) throw Error("TomTom TXT/GeoJSON feature counts differ");
            if(eventTxtCount!==events.features.length) throw Error("511LA/DOTD TXT/GeoJSON event counts differ");
            if(!eventTxt.includes("IconFile: 1,") || !eventTxt.includes("IconFile: 2,") || !eventTxt.includes("IconFile: 3,")) throw Error("Event icon references missing");
            for(const category of ["ROAD CLOSURE","CONSTRUCTION / ROADWORK","CONSTRUCTION / WORKERS PRESENT","TRAFFIC INCIDENT","WEATHER INCIDENT","WEATHER CLOSURE","SPECIAL EVENT","OTHER 511LA / DOTD EVENT"]){if(events.features.some(f=>f.properties.event_type===({ "ROAD CLOSURE":"closure","CONSTRUCTION / ROADWORK":"construction","CONSTRUCTION / WORKERS PRESENT":"workers","TRAFFIC INCIDENT":"incident","WEATHER INCIDENT":"weather_incident","WEATHER CLOSURE":"weather_closure","SPECIAL EVENT":"special","OTHER 511LA / DOTD EVENT":"other"})[category]) && !eventTxt.includes(category)) throw Error("Placefile category label missing: "+category);}
            if(Number(events.metadata?.eventCount)!==events.features.length) throw Error("Event metadata count does not match features");
            if(!events.metadata?.generatedAt || !roads.metadata?.updated) throw Error("Missing source refresh timestamps");
            for(const f of roads.features){const p=f.properties;if(p.traffic_status==="STOPPED / VERY SLOW" && p.stroke?.toLowerCase()!=="#ff0000") throw Error("Stopped traffic color incorrect");if(p.traffic_status==="CLOSED" && p.stroke?.toLowerCase()!=="#ff00ff") throw Error("Closure color incorrect");}
            console.log("Validated separately refreshed feeds:",roads.features.length,"TomTom roads and",events.features.length,"511LA/DOTD events; TXT and GeoJSON counts match.");
          '
      - name: Publish all four separate source files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add traffic.txt traffic.geojson traffic-events/traffic-events.txt traffic-events/traffic-events.geojson
          if git diff --cached --quiet; then
            echo "All separate traffic source feeds unchanged."
            exit 0
          fi
          git commit -m "Refresh separate TomTom and 511LA DOTD traffic feeds"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push; then exit 0; fi
            echo "Push attempt $attempt failed; retrying."
            sleep 3
          done
          echo "Unable to publish separate traffic source feeds."
          exit 1
