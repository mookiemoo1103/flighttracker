name: Refresh Separate TomTom and Louisiana 511 Traffic Feeds

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/generate-traffic.mjs"
      - "scripts/generate-traffic-events.mjs"
      - ".github/workflows/refresh-combined-traffic.yml"

permissions:
  contents: write

concurrency:
  group: separate-traffic-feeds
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate TomTom traffic speed files
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
        run: node scripts/generate-traffic.mjs
      - name: Generate separate 511LA and DOTD event files
        env:
          LOUISIANA_511_API_KEY: ${{ secrets.LOUISIANA_511_API_KEY }}
        run: node scripts/generate-traffic-events.mjs
      - name: Validate separate source files
        run: |
          set -euo pipefail
          test -s traffic.txt
          test -s traffic.geojson
          test -s traffic-events/traffic-events.txt
          test -s traffic-events/traffic-events.geojson
          test -s traffic-events/assets/road-closure.png
          test -s traffic-events/assets/road-construction.png
          test -s traffic-events/assets/road-incident.png
          grep -q 'Source: TomTom Traffic Flow Vector Tiles' traffic.txt
          ! grep -q '511LA / DOTD EVENT LAYER' traffic.txt
          grep -q 'Sources: Louisiana 511LA Events API + DOTD 511 Road Closures FeatureServer' traffic-events/traffic-events.txt
          node --input-type=module -e '
            import { readFile } from "node:fs/promises";
            const roads=JSON.parse(await readFile("traffic.geojson","utf8"));
            const events=JSON.parse(await readFile("traffic-events/traffic-events.geojson","utf8"));
            if(roads.type!=="FeatureCollection" || !Array.isArray(roads.features) || !roads.features.length) throw Error("TomTom GeoJSON is invalid or empty");
            if(events.type!=="FeatureCollection" || !Array.isArray(events.features)) throw Error("Event GeoJSON is invalid");
            if(!String(roads.metadata?.source||"").includes("TomTom")) throw Error("TomTom source metadata missing");
            if(!Array.isArray(events.metadata?.sources) || !events.metadata.sources.some(s=>String(s).includes("511LA")) || !events.metadata.sources.some(s=>String(s).includes("DOTD"))) throw Error("511LA/DOTD source metadata missing");
            if(roads.features.some(f=>f.properties?.source || f.properties?.layer==="511la-dotd-events")) throw Error("Non-TomTom event data found in TomTom GeoJSON");
            if(roads.features.some(f=>f.geometry?.type!=="LineString")) throw Error("Unexpected geometry in TomTom GeoJSON");
            if(events.features.some(f=>f.geometry?.type!=="Point")) throw Error("Unexpected geometry in event GeoJSON");
            for(const f of roads.features){const p=f.properties;if(p.traffic_status==="STOPPED / VERY SLOW" && p.stroke?.toLowerCase()!=="#ff0000") throw Error("Stopped traffic color incorrect");if(p.traffic_status==="CLOSED" && p.stroke?.toLowerCase()!=="#ff00ff") throw Error("Closure color incorrect");}
            console.log("Validated separate feeds:",roads.features.length,"TomTom roads and",events.features.length,"511LA/DOTD events.");
          '
      - name: Publish all four separate source files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add traffic.txt traffic.geojson traffic-events/traffic-events.txt traffic-events/traffic-events.geojson
          if git diff --cached --quiet; then
            echo "All separate traffic source feeds unchanged."
            exit 0
          fi
          git commit -m "Refresh separate TomTom and 511LA DOTD traffic feeds"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push; then exit 0; fi
            echo "Push attempt $attempt failed; retrying."
            sleep 3
          done
          echo "Unable to publish separate traffic source feeds."
          exit 1
