name: Refresh Louisiana traffic events source feed (manual)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate 511LA and DOTD source files only
        env:
          LOUISIANA_511_API_KEY: ${{ secrets.LOUISIANA_511_API_KEY }}
        run: node scripts/generate-traffic-events.mjs
      - name: Publish event source files only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add traffic-events/traffic-events.txt traffic-events/traffic-events.geojson
          git commit -m "Refresh 511LA DOTD source traffic files" || exit 0
          git push
