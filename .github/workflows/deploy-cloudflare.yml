name: Deploy Flight Tracker to Cloudflare
on:
  workflow_dispatch:
  push:
    paths:
      - "cloudflare/worker.js"
      - "assets/aircraft-gray.png"
      - "assets/helicopter-map-icon-96.png"
      - "assets/passenger-light-red.png"
      - "assets/commercial-yellow.png"
      - "assets/military-green.png"
      - "assets/general-aviation-blue.png"
      - "assets/business-jet-purple.png"
      - "wrangler.jsonc"
      - ".github/workflows/deploy-cloudflare.yml"
permissions:
  contents: read

concurrency:
  group: flighttracker-cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply D1 migrations
        run: npx wrangler@4 d1 migrations apply DB --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "ff9184692bc7005819c0d11e2aa7e1a3"
      - name: Deploy Worker
        run: npx wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "ff9184692bc7005819c0d11e2aa7e1a3"
      - name: Configure FlyItalyADSB API key
        run: printf '%s' "$FLYITALYADSB_API_KEY" | npx wrangler@4 secret put FLYITALYADSB_API_KEY
        env:
          FLYITALYADSB_API_KEY: ${{ secrets.FLYITALYADSB_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "ff9184692bc7005819c0d11e2aa7e1a3"
      - name: Smoke-test provider, freshness, and all placefiles
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://flighttracker.mitchellgeissler.workers.dev"
          echo "ADS-B provider connectivity probe:"
          curl --silent --show-error --max-time 20 "$BASE/adsbfi-probe" | tee /tmp/probe.json || true
          echo
          echo "Current ADS-B health:"
          curl --silent --show-error --max-time 20 "$BASE/adsbfi-health" | tee /tmp/health-before.json || true
          echo
          deadline=$((SECONDS + 100))
          while true; do
            curl --silent --show-error --max-time 20 "$BASE/adsbfi-health" -o /tmp/health.json || true
            if python - <<'PY'
          import json, time, sys
          try:
              with open("/tmp/health.json", encoding="utf-8") as f:
                  health = json.load(f)
              now = int(time.time() * 1000)
              regions = health.get("regions", [])
              ages = [int(row.get("age_seconds", 999999)) for row in regions]
              fresh = (
                  health.get("source") == "adsb.fi"
                  and len(regions) == 38
                  and int(health.get("last_success", 0)) > 0
                  and now - int(health["last_success"]) < 120000
                  and len(ages) == 38
                  and max(ages, default=999999) <= 120
              )
              if fresh:
                  print(f"Fresh ADS-B grid: {len(regions)}/38 regions; oldest region {max(ages)} seconds")
                  sys.exit(0)
              print(f"Waiting for fresh grid: {len(regions)}/38 cached; oldest region {max(ages, default=-1)} seconds; failed this cycle: {health.get('regions_failed')}; error: {health.get('last_error')}")
          except Exception as exc:
              print("Health check not ready:", exc)
          sys.exit(1)
          PY
            then
              break
            fi
            if (( SECONDS >= deadline )); then
              echo "ADS-B full-grid data did not refresh within 100 seconds"
              cat /tmp/probe.json || true
              cat /tmp/health.json || true
              exit 1
            fi
            sleep 5
          done
          for region in pacific southwest mountain central southeast northeast; do
            curl --fail --silent --show-error --retry 3 --retry-delay 2 "$BASE/$region.txt" -o "/tmp/$region.txt"
            grep -q '^RefreshSeconds: 15$' "/tmp/$region.txt"
            grep -q 'Helicopters rendered:' "/tmp/$region.txt"
            echo "$region.txt OK"
          done
          curl --fail --silent --show-error "$BASE/flighttracker.txt" -o /tmp/flighttracker.txt
          grep -q '^RefreshSeconds: 15$' /tmp/flighttracker.txt
          grep -q '^IconFile: 7,' /tmp/flighttracker.txt
          echo "flighttracker.txt OK"
