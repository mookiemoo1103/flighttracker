name: Deploy Flight Tracker to Cloudflare
on:
  workflow_dispatch:
  push:
    paths:
      - "cloudflare/worker.js"
      - "cloudflare/traffic.js"
      - "cloudflare/migrations/**"
      - "tests/**"
      - "assets/airplane-commercial-yellow.png"
      - "assets/airplane-private-blue.png"
      - "assets/airplane-military-gray.png"
      - "assets/helicopter-aircraft-theme-96.png"
      - "wrangler.jsonc"
      - ".github/workflows/deploy-cloudflare.yml"
permissions:
  contents: read
concurrency:
  group: flighttracker-known-good-restore
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate Worker JavaScript
        run: node --check cloudflare/worker.js
      - name: Validate traffic Worker module
        run: node --check cloudflare/traffic.js
      - name: Test aircraft classification
        run: node tests/aircraft-classification.test.mjs
      - name: Apply D1 migrations
        run: npx wrangler@4 d1 migrations apply DB --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "ff9184692bc7005819c0d11e2aa7e1a3"
      - name: Deploy Worker
        run: npx wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "ff9184692bc7005819c0d11e2aa7e1a3"
      - name: Configure FlyItalyADSB API key
        run: printf '%s' "$FLYITALYADSB_API_KEY" | npx wrangler@4 secret put FLYITALYADSB_API_KEY
        env:
          FLYITALYADSB_API_KEY: ${{ secrets.FLYITALYADSB_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "ff9184692bc7005819c0d11e2aa7e1a3"
      - name: Configure TomTom Traffic API key (when supplied)
        shell: bash
        run: |
          if [ -n "$TOMTOM_API_KEY" ]; then
            printf '%s' "$TOMTOM_API_KEY" | npx wrangler@4 secret put TOMTOM_API_KEY
          else
            echo "TOMTOM_API_KEY is not configured; the separate traffic placefile will show setup instructions."
          fi
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "ff9184692bc7005819c0d11e2aa7e1a3"
      - name: Verify live FlyItaly collection and all placefiles
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://flighttracker.mitchellgeissler.workers.dev"
          deadline=$((SECONDS + 300))
          while true; do
            curl --retry 8 --retry-all-errors --retry-delay 3 --retry-max-time 90 --fail --silent --show-error --max-time 20 "$BASE/health" -o /tmp/health.json
            curl --retry 8 --retry-all-errors --retry-delay 3 --retry-max-time 90 --fail --silent --show-error --max-time 20 "$BASE/adsblol-health" -o /tmp/adsblol-health.json
          curl --retry 8 --retry-all-errors --retry-delay 3 --retry-max-time 90 --fail --silent --show-error --max-time 20 "$BASE/registry-health" -o /tmp/registry-health.json
            if python - <<'PY'
          import json, time, sys
          try:
              with open("/tmp/health.json", encoding="utf-8") as f:
                  health = json.load(f)
              state = {row["key"]: row["value"] for row in health.get("state", [])}
              last_success = int(state.get("last_success", 0))
              age = (int(time.time() * 1000) - last_success) // 1000 if last_success else 999999
              batch_count = int(state.get("last_batch_count", 0))
              batch_failed = int(state.get("last_batch_failed", 0))
              lol_success = int(state.get("adsblol_last_success", 0))
              lol_age = (int(time.time() * 1000) - lol_success) // 1000 if lol_success else 999999
              lol_count = int(state.get("adsblol_last_batch_count", 0))
              with open("/tmp/adsblol-health.json", encoding="utf-8") as f:
                  lol_health = json.load(f)
              lol_regions = int(lol_health.get("regions_cached", 0))
              if health.get("ok") is True and last_success and age <= 180 and batch_count >= 20 and batch_failed <= 7 and lol_success and lol_age <= 300 and lol_count > 0 and lol_regions >= 30:
                  print(f"FlyItaly succeeded {age}s ago ({batch_count}/27 areas); ADSB.lol succeeded {lol_age}s ago ({lol_count}/10 areas), {lol_regions}/{lol_health.get('total_regions')} coverage regions cached; full FlyItaly sweep ~{health.get('approximate_full_sweep_minutes')} minutes")
                  print("ADSB.lol latest collection errors:", lol_health.get("last_error") or "none")
                  sys.exit(0)
              print(f"Waiting for both live feeds: FlyItaly age={age}s batch={batch_count}/27 failed={batch_failed}; ADSB.lol age={lol_age}s batch={lol_count}/10 cached={lol_regions}/{lol_health.get('total_regions')} error={lol_health.get('last_error') or 'none'}")
          except Exception as exc:
              print("Health check not ready:", exc)
          sys.exit(1)
          PY
            then
              break
            fi
            if (( SECONDS >= deadline )); then
              echo "Both aircraft feeds did not reach the required live-collection state within 300 seconds"
              cat /tmp/health.json || true
              exit 1
            fi
            sleep 5
          done
          curl --retry 8 --retry-all-errors --retry-delay 3 --retry-max-time 90 --fail --silent --show-error --max-time 20 "$BASE/adsblol-health" -o /tmp/adsblol-health.json
          python - <<'PY'
          import json, time
          with open("/tmp/adsblol-health.json", encoding="utf-8") as f:
              h=json.load(f)
          age=(int(time.time()*1000)-int(h.get("last_success",0)))//1000
          assert h.get("ok") and h.get("last_batch_count",0)>0 and age<=300, h
          print(f"ADSB.lol live: {h.get('regions_cached')} regions cached; {h.get('last_batch_count')}/10 areas last batch; {age}s old")
          PY
          curl --retry 8 --retry-all-errors --retry-delay 3 --retry-max-time 90 --fail --silent --show-error --max-time 20 "$BASE/adsblol-test.txt" -o /tmp/adsblol-test.txt
          curl --retry 8 --retry-all-errors --retry-delay 3 --retry-max-time 90 --fail --silent --show-error --max-time 20 "$BASE/flyitaly-test.txt" -o /tmp/flyitaly-test.txt
          grep -q '^; Flight data: ADSB.lol' /tmp/adsblol-test.txt
          grep -q '^; Flight data: FlyItalyADSB' /tmp/flyitaly-test.txt
          for region in pacific southwest mountain central southeast northeast; do
            curl --retry 8 --retry-all-errors --retry-delay 3 --retry-max-time 90 --fail --silent --show-error --max-time 20 "$BASE/$region.txt" -o "/tmp/$region.txt"
            grep -q '^Refresh: 1$' "/tmp/$region.txt"
            grep -q '^IconFile: 7,' "/tmp/$region.txt"
            grep -q '^IconFile: 2, 96, 96, 48, 48, "https://raw.githubusercontent.com/mookiemoo1103/flighttracker/main/assets/helicopter-aircraft-theme-96.png' "/tmp/$region.txt"
            grep -q '^IconFile: 3,' "/tmp/$region.txt"
            grep -q '^IconFile: 4,' "/tmp/$region.txt"
            grep -q '^IconFile: 5,' "/tmp/$region.txt"
            grep -q '^IconFile: 6,' "/tmp/$region.txt"
            object_count=$(grep -c '^Object:' "/tmp/$region.txt" || true)
            echo "$region.txt aircraft records: $object_count"
            test "$object_count" -gt 0
            icon_count=$(grep -c '^Icon:' "/tmp/$region.txt" || true)
            test "$icon_count" -eq "$object_count"
            grep -q '^Title:' "/tmp/$region.txt"
            echo "$region.txt OK"
          done
          curl --retry 8 --retry-all-errors --retry-delay 3 --retry-max-time 90 --fail --silent --show-error --max-time 20 "$BASE/flighttracker.txt" -o /tmp/flighttracker.txt
          grep -q '^Refresh: 1$' /tmp/flighttracker.txt
          grep -q '^IconFile: 7,' /tmp/flighttracker.txt
          grep -q '^IconFile: 2, 96, 96, 48, 48, "https://raw.githubusercontent.com/mookiemoo1103/flighttracker/main/assets/helicopter-aircraft-theme-96.png' /tmp/flighttracker.txt
          object_count=$(grep -c '^Object:' /tmp/flighttracker.txt || true)
          echo "Nationwide placefile contains $object_count aircraft records"
          test "$object_count" -gt 0
          icon_count=$(grep -c '^Icon:' /tmp/flighttracker.txt || true)
          test "$icon_count" -eq "$object_count"
          for category in 2 3 4 5 6 7; do
            category_count=$(grep -cE "^Icon: [^,]*,[^,]*,[^,]*,$category,1," /tmp/flighttracker.txt || true)
            echo "Aircraft icon category $category: $category_count"
          done
          helicopter_count=$(grep -cE '^Icon: [^,]*,[^,]*,[^,]*,2,1,' /tmp/flighttracker.txt || true)
          echo "Helicopters displayed: $helicopter_count"
          test "$helicopter_count" -gt 0
          grep -q '^; Business jets rendered:' /tmp/flighttracker.txt
          grep -q '^; General aviation rendered:' /tmp/flighttracker.txt
      - name: Diagnose separate traffic placefile output
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -u
          BASE="https://flighttracker.mitchellgeissler.workers.dev"
          curl --retry 2 --retry-all-errors --retry-delay 2 --fail --silent --show-error --max-time 25 "$BASE/traffic.txt" -o /tmp/traffic.txt || {
            echo "Traffic endpoint request failed"
            exit 0
          }
          image_count=$(grep -c '^Image:' /tmp/traffic.txt || true)
          echo "Traffic raster image overlays: $image_count"
          test "$image_count" -eq 12
          # Test a tile centered on Pearl River / Slidell rather than an outer edge tile.
          tile_url=$(grep '^Image:' /tmp/traffic.txt | sed -n '7p' | cut -d' ' -f2-)
          curl --retry 3 --retry-all-errors --retry-delay 2 --fail --silent --show-error --max-time 20 "$tile_url" -o /tmp/traffic-tile.png
          file /tmp/traffic-tile.png
          python - <<'PY'
          from pathlib import Path
          import struct, zlib
          data=Path("/tmp/traffic-tile.png").read_bytes()
          assert data.startswith(bytes([137,80,78,71,13,10,26,10])), "Traffic tile is not a PNG image"
          pos=8; compressed=b""; width=height=color_type=bit_depth=None
          while pos < len(data):
              n=struct.unpack(">I",data[pos:pos+4])[0]; typ=data[pos+4:pos+8]; chunk=data[pos+8:pos+8+n]; pos += 12+n
              if typ==b"IHDR": width,height,bit_depth,color_type,_=struct.unpack(">IIBBBBB",chunk)
              elif typ==b"IDAT": compressed += chunk
              elif typ==b"IEND": break
          assert bit_depth==8 and color_type in (2,6), f"Unsupported PNG format: depth={bit_depth}, type={color_type}"
          bpp=4 if color_type==6 else 3
          raw=zlib.decompress(compressed); stride=width*bpp; rows=[]; prev=bytearray(stride); off=0
          for _ in range(height):
              filt=raw[off]; off+=1; scan=bytearray(raw[off:off+stride]); off+=stride
              for i in range(stride):
                  a=scan[i-bpp] if i>=bpp else 0; b=prev[i]; cc=prev[i-bpp] if i>=bpp else 0
                  if filt==1: scan[i]=(scan[i]+a)&255
                  elif filt==2: scan[i]=(scan[i]+b)&255
                  elif filt==3: scan[i]=(scan[i]+((a+b)//2))&255
                  elif filt==4:
                      p=a+b-cc; pa=abs(p-a); pb=abs(p-b); pc=abs(p-cc); pr=a if pa<=pb and pa<=pc else (b if pb<=pc else cc); scan[i]=(scan[i]+pr)&255
                  elif filt!=0: raise AssertionError(f"Unknown PNG filter {filt}")
              rows.append(scan); prev=scan
          opaque=0; traffic={}
          for row in rows:
              for i in range(0,len(row),bpp):
                  r,g,b=row[i:i+3]; a=row[i+3] if bpp==4 else 255
                  if a:
                      opaque+=1
                      if g>r*1.25 and g>b*0.75: traffic["green"]=traffic.get("green",0)+1
                      if r>180 and g>100 and g<230 and b<100: traffic["yellow_or_orange"]=traffic.get("yellow_or_orange",0)+1
                      if r>150 and r>g*1.4 and r>b*1.4: traffic["red"]=traffic.get("red",0)+1
          print(f"Pearl River tile {width}x{height}: {opaque} nontransparent pixels; likely traffic colors: {traffic}")
          assert opaque>0, "TomTom traffic tile is completely transparent"
          assert sum(traffic.values())>0, "TomTom tile contains no recognizable traffic-color pixels"
          PY
          color_count=$(grep -c '^Color:' /tmp/traffic.txt || true)
          line_count=$(grep -c '^Line:' /tmp/traffic.txt || true)
          echo "Traffic placefile Color directives: $color_count"
          echo "Traffic placefile Line objects: $line_count"
          echo "Traffic color distribution (RGB: segment count):"
          grep '^Color:' /tmp/traffic.txt | sort | uniq -c | sort -nr | head -10 || true
          echo "Traffic line widths:"
          grep '^Line:' /tmp/traffic.txt | sed -E 's/^Line: ([^,]+).*/\\1/' | sort | uniq -c | sort -nr || true
          echo "First traffic drawing commands:"
          grep -A3 -m3 '^Color:' /tmp/traffic.txt || true
          grep -E '^(; TomTom|; Updated:|; Unique traffic segments rendered:|; TomTom traffic refresh failed:|; Live traffic placefile|Title:|Refresh:)' /tmp/traffic.txt | head -20 || true
          if [ "$line_count" -gt 0 ] && [ "$color_count" -eq "$line_count" ]; then
            echo "Traffic output contains matching color and line directives."
          else
            echo "Traffic output does not contain valid colored road-line objects."
            head -35 /tmp/traffic.txt
          fi

