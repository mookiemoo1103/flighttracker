name: Deploy Flight Tracker to Cloudflare
on:
  workflow_dispatch:
  push:
    paths:
      - "cloudflare/worker.js"
      - "assets/aircraft-gray.png"
      - "assets/helicopter-map-icon-96.png"
      - "assets/passenger-light-red.png"
      - "assets/commercial-yellow.png"
      - "assets/military-green.png"
      - "assets/general-aviation-blue.png"
      - "assets/business-jet-purple.png"
      - "wrangler.jsonc"
      - ".github/workflows/deploy-cloudflare.yml"
permissions:
  contents: read

concurrency:
  group: flighttracker-cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply D1 migrations
        run: npx wrangler@4 d1 migrations apply DB --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "ff9184692bc7005819c0d11e2aa7e1a3"
      - name: Deploy Worker
        run: npx wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "ff9184692bc7005819c0d11e2aa7e1a3"
      - name: Configure FlyItalyADSB API key
        run: printf '%s' "$FLYITALYADSB_API_KEY" | npx wrangler@4 secret put FLYITALYADSB_API_KEY
        env:
          FLYITALYADSB_API_KEY: ${{ secrets.FLYITALYADSB_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "ff9184692bc7005819c0d11e2aa7e1a3"
      - name: Smoke-test live collection and all placefiles
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://flighttracker.mitchellgeissler.workers.dev"
          deadline=$((SECONDS + 180))
          while true; do
            curl --fail --silent --show-error --max-time 20 "$BASE/health" -o /tmp/health.json
            if python - <<'PY'
          import json, time, sys
          try:
              with open("/tmp/health.json", encoding="utf-8") as f:
                  health = json.load(f)
              feed = health["feeds"]["flyitaly"]
              now = int(time.time() * 1000)
              last_success = int(feed.get("last_success", 0))
              age = (now - last_success) // 1000 if last_success else 999999
              regions = feed.get("regions", [])
              plan = str(health.get("quota", {}).get("plan", "unknown")).lower()
              ages = [int(row.get("age_seconds", 999999)) for row in regions]
              fresh = age <= 120 and int(feed.get("last_batch_count", 0)) > 0
              if plan in ("starter", "pro", "fleet"):
                  fresh = fresh and len(regions) == 23 and max(ages, default=999999) <= 120
              if fresh:
                  print(f"Live feed OK: plan={plan}; last collection={age}s ago; {feed.get('last_batch_count')} regions collected; estimated full sweep={feed.get('full_sweep_minutes')} minute(s)")
                  sys.exit(0)
              print(f"Waiting for live collection: plan={plan}; last success={age}s ago; batch={feed.get('last_batch_count')}; regions={len(regions)}/23; failures={feed.get('regions_failed')}; error={feed.get('last_error')}")
          except Exception as exc:
              print("Health check not ready:", exc)
          sys.exit(1)
          PY
            then
              break
            fi
            if (( SECONDS >= deadline )); then
              echo "FlyItalyADSB did not complete a fresh collection within 180 seconds"
              cat /tmp/health.json || true
              exit 1
            fi
            sleep 5
          done
          for region in pacific southwest mountain central southeast northeast; do
            if ! curl --fail --silent --show-error --max-time 20 "$BASE/$region.txt" -o "/tmp/$region.txt"; then
              curl --silent --show-error --max-time 20 "$BASE/$region.txt" -o "/tmp/$region.txt" || true
              cat "/tmp/$region.txt" || true
              exit 1
            fi
            grep -q '^RefreshSeconds: 15$' "/tmp/$region.txt"
            grep -q '^IconFile: 2,' "/tmp/$region.txt"
            grep -q '^IconFile: 7,' "/tmp/$region.txt"
            grep -q 'Helicopters rendered:' "/tmp/$region.txt"
            echo "$region.txt OK"
          done
          if ! curl --fail --silent --show-error --max-time 20 "$BASE/flighttracker.txt" -o /tmp/flighttracker.txt; then
            curl --silent --show-error --max-time 20 "$BASE/flighttracker.txt" -o /tmp/flighttracker.txt || true
            cat /tmp/flighttracker.txt || true
            exit 1
          fi
          grep -q '^RefreshSeconds: 15$' /tmp/flighttracker.txt
          grep -q '^IconFile: 2,' /tmp/flighttracker.txt
          grep -q '^IconFile: 7,' /tmp/flighttracker.txt
          echo "flighttracker.txt OK"
