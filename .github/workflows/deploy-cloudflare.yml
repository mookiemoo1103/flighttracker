name: Deploy Flight Tracker to Cloudflare
on:
  workflow_dispatch:
  push:
    paths:
      - "cloudflare/worker.js"
      - "assets/airplane-commercial-yellow.png"
      - "assets/airplane-private-blue.png"
      - "assets/airplane-military-gray.png"
      - "assets/helicopter-gray.png"
      - "wrangler.jsonc"
      - ".github/workflows/deploy-cloudflare.yml"
permissions:
  contents: read
concurrency:
  group: flighttracker-known-good-restore
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate Worker JavaScript
        run: node --check cloudflare/worker.js
      - name: Apply D1 migrations
        run: npx wrangler@4 d1 migrations apply DB --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "ff9184692bc7005819c0d11e2aa7e1a3"
      - name: Deploy Worker
        run: npx wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "ff9184692bc7005819c0d11e2aa7e1a3"
      - name: Configure FlyItalyADSB API key
        run: printf '%s' "$FLYITALYADSB_API_KEY" | npx wrangler@4 secret put FLYITALYADSB_API_KEY
        env:
          FLYITALYADSB_API_KEY: ${{ secrets.FLYITALYADSB_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "ff9184692bc7005819c0d11e2aa7e1a3"
      - name: Verify live FlyItaly collection and all placefiles
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://flighttracker.mitchellgeissler.workers.dev"
          deadline=$((SECONDS + 180))
          while true; do
            curl --fail --silent --show-error --max-time 20 "$BASE/health" -o /tmp/health.json
            if python - <<'PY'
          import json, time, sys
          try:
              with open("/tmp/health.json", encoding="utf-8") as f:
                  health = json.load(f)
              state = {row["key"]: row["value"] for row in health.get("state", [])}
              last_success = int(state.get("last_success", 0))
              age = (int(time.time() * 1000) - last_success) // 1000 if last_success else 999999
              batch_count = int(state.get("last_batch_count", 0))
              batch_failed = int(state.get("last_batch_failed", 0))
              if health.get("ok") is True and last_success and age <= 180 and batch_count >= 20 and batch_failed <= 7:
                  print(f"FlyItaly collection succeeded {age}s ago; {batch_count}/27 areas refreshed; {batch_failed} failed; full sweep ~{health.get('approximate_full_sweep_minutes')} minutes")
                  sys.exit(0)
              print(f"Waiting for healthy collection: last success {age}s ago; batch={batch_count}/27; failed={batch_failed}")
          except Exception as exc:
              print("Health check not ready:", exc)
          sys.exit(1)
          PY
            then
              break
            fi
            if (( SECONDS >= deadline )); then
              echo "No successful FlyItaly collection within 180 seconds"
              cat /tmp/health.json || true
              exit 1
            fi
            sleep 5
          done
          for region in pacific southwest mountain central southeast northeast; do
            curl --fail --silent --show-error --max-time 20 "$BASE/$region.txt" -o "/tmp/$region.txt"
            grep -q '^Refresh: 1$' "/tmp/$region.txt"
            grep -q '^IconFile: 7,' "/tmp/$region.txt"
            grep -q '^IconFile: 2,' "/tmp/$region.txt"
            grep -q '^IconFile: 3,' "/tmp/$region.txt"
            grep -q '^IconFile: 4,' "/tmp/$region.txt"
            grep -q '^IconFile: 5,' "/tmp/$region.txt"
            grep -q '^IconFile: 6,' "/tmp/$region.txt"
            object_count=$(grep -c '^Object:' "/tmp/$region.txt" || true)
            echo "$region.txt aircraft records: $object_count"
            test "$object_count" -gt 0
            grep -q '^Title:' "/tmp/$region.txt"
            echo "$region.txt OK"
          done
          curl --fail --silent --show-error --max-time 20 "$BASE/flighttracker.txt" -o /tmp/flighttracker.txt
          grep -q '^Refresh: 1$' /tmp/flighttracker.txt
          grep -q '^IconFile: 7,' /tmp/flighttracker.txt
          grep -q '^IconFile: 2,' /tmp/flighttracker.txt
          object_count=$(grep -c '^Object:' /tmp/flighttracker.txt || true)
          echo "Nationwide placefile contains $object_count aircraft records"
          test "$object_count" -gt 0
          for category in 2 3 4 5 6 7; do
            category_count=$(grep -cE "^Icon: [^,]*,[^,]*,[^,]*,$category,1," /tmp/flighttracker.txt || true)
            echo "Aircraft icon category $category: $category_count"
          done
          helicopter_count=$(grep -cE '^Icon: [^,]*,[^,]*,[^,]*,2,1,' /tmp/flighttracker.txt || true)
          echo "Helicopters displayed: $helicopter_count"
          test "$helicopter_count" -gt 0
