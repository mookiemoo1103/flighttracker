name: Deploy Flight Tracker to Cloudflare

on:
  workflow_dispatch:
  push:
    paths:
      - "cloudflare/worker.js"
      - "cloudflare/traffic.js"
      - "cloudflare/migrations/**"
      - "tests/**"
      - "assets/airplane-commercial-yellow.png"
      - "assets/airplane-private-blue.png"
      - "assets/airplane-military-gray.png"
      - "assets/helicopter-aircraft-theme-96.png"
      - "wrangler.jsonc"
      - ".github/workflows/deploy-cloudflare.yml"

permissions:
  contents: read

concurrency:
  group: flighttracker-known-good-restore
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate Worker JavaScript
        run: node --check cloudflare/worker.js

      - name: Validate traffic Worker module
        run: node --check cloudflare/traffic.js

      - name: Test aircraft classification
        run: node tests/aircraft-classification.test.mjs

      - name: Apply D1 migrations
        run: npx wrangler@4 d1 migrations apply DB --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "ff9184692bc7005819c0d11e2aa7e1a3"

      - name: Deploy Worker
        run: npx wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "ff9184692bc7005819c0d11e2aa7e1a3"

      - name: Configure FlyItalyADSB API key
        run: printf '%s' "$FLYITALYADSB_API_KEY" | npx wrangler@4 secret put FLYITALYADSB_API_KEY
        env:
          FLYITALYADSB_API_KEY: ${{ secrets.FLYITALYADSB_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "ff9184692bc7005819c0d11e2aa7e1a3"

      - name: Configure TomTom Traffic API key (when supplied)
        shell: bash
        run: |
          if [ -n "$TOMTOM_API_KEY" ]; then
            printf '%s' "$TOMTOM_API_KEY" | npx wrangler@4 secret put TOMTOM_API_KEY
          else
            echo "TOMTOM_API_KEY is not configured; the GitHub-hosted traffic workflow is independent."
          fi
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "ff9184692bc7005819c0d11e2aa7e1a3"

      - name: Verify live aircraft feeds
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://flighttracker.mitchellgeissler.workers.dev"
          curl --retry 5 --retry-all-errors --retry-delay 3 --fail --silent --show-error --max-time 25 "$BASE/health" -o /tmp/health.json
          curl --retry 5 --retry-all-errors --retry-delay 3 --fail --silent --show-error --max-time 25 "$BASE/adsblol-health" -o /tmp/adsblol-health.json
          curl --retry 5 --retry-all-errors --retry-delay 3 --fail --silent --show-error --max-time 25 "$BASE/flighttracker.txt" -o /tmp/flighttracker.txt
          grep -q '^Refresh: 1$' /tmp/flighttracker.txt
          grep -q '^IconFile:' /tmp/flighttracker.txt
          object_count=$(grep -c '^Object:' /tmp/flighttracker.txt || true)
          test "$object_count" -gt 0
          echo "Aircraft placefile verified: $object_count aircraft records."
