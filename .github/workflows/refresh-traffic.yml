name: Refresh Southeast Louisiana traffic placefile

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/generate-traffic.mjs"
      - ".github/workflows/refresh-traffic.yml"

permissions:
  contents: write

concurrency:
  group: github-traffic-placefile
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate live vector traffic placefile
        run: node scripts/generate-traffic.mjs
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
      - name: Validate colored traffic placefile
        shell: bash
        run: |
          set -euo pipefail
          test -s traffic.txt
          test -s traffic.geojson
          node -e 'const j=JSON.parse(require("fs").readFileSync("traffic.geojson","utf8")); if(j.type!=="FeatureCollection" || !Array.isArray(j.features) || j.features.length<100 || !j.features.every(f=>f.geometry?.type==="LineString" && /^#[0-9a-f]{6}$/i.test(f.properties?.stroke) && f.properties?.["stroke-opacity"]===1)) process.exit(1); console.log("Validated",j.features.length,"GeoJSON road features with per-feature colors.")'
          colors=$(grep -c '^Color:' traffic.txt)
          lines=$(grep -c '^Line:' traffic.txt)
          test "$lines" -gt 100
          test "$colors" -eq "$lines"
          valid_colors=$(grep -Ec '^Color: (0 220 0|255 220 0|255 128 0|255 0 0)$' traffic.txt)
          test "$valid_colors" -eq "$colors"
          echo "Validated $lines traffic segments with matching RGB color directives."
          echo "Published color distribution:"
          grep '^Color:' traffic.txt | sort | uniq -c | sort -nr
      - name: Publish updated placefile to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add traffic.txt traffic.geojson
          if git diff --cached --quiet; then
            echo "Traffic placefile unchanged."
            exit 0
          fi
          git commit -m "Refresh Southeast Louisiana traffic placefile"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push; then
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying."
            sleep 3
          done
          echo "Unable to publish traffic placefile after three attempts."
          exit 1
