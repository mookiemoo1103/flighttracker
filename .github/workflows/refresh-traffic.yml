name: Refresh TomTom traffic source feed (manual)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate TomTom source files only
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
        run: node scripts/generate-traffic.mjs
      - name: Publish TomTom source files only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add traffic.txt traffic.geojson
          git commit -m "Refresh TomTom source traffic files" || exit 0
          git push
